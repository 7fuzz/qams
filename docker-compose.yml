services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testing-mgmt-web
    restart: always
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env.production
    environment:
      PORT: ${APP_PORT:-3000}
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_management}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  smtp:
    build:
      context: ./smtp-service
      dockerfile: Dockerfile
    container_name: testing-mgmt-smtp
    restart: always
    ports:
      - "${SMTP_PORT:-587}:${SMTP_PORT:-587}"
    env_file:
      - .env.production
    environment:
      SMTP_PORT: ${SMTP_PORT:-587}
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_management}
      UPLOAD_DIR: /app/attachments
    volumes:
      - ./public/uploads/mail:/app/attachments
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    container_name: testing-mgmt-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-test_management}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-root}", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
